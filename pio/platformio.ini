; PandaDeck - PlatformIO build with a custom sdkconfig (pioarduino hybrid compile).
;
; Why: the stock Arduino-ESP32 core ships prebuilt with a 32 KB / 32 B data
; cache and a non-IRAM-safe RGB LCD ISR. At 800x480 the bounce-buffer refill
; through that cache can't keep up under load -> jumping lines / shifted image.
; These are Espressif's recommended settings for ESP32-S3 RGB panels.
; Same sources as the arduino-cli build (firmware/PandaDeck).

[platformio]
src_dir = ../firmware/PandaDeck
; short paths: the IDF hybrid compile trips Windows' path-length limit

[env:pandadeck]
extra_scripts = pre:fs_include.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = pandatouch
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = pandatouch_16MB.csv
board_build.f_cpu = 240000000L
build_flags =
  ; USB mode / CDC / PSRAM come from boards/pandatouch.json so they apply to IDF components too
  -DLV_CONF_INCLUDE_SIMPLE
  -I../firmware/libraries
lib_deps =
  lvgl/lvgl@9.5.0
  bblanchon/ArduinoJson@7.4.2
custom_sdkconfig =
  CONFIG_ESP32S3_DATA_CACHE_64KB=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
; fb_gfx (camera framebuffer gfx) is fetched from git and breaks the IDF component
; manager on Windows ('git init --bare' cwd error); PandaDeck doesn't use it.
custom_component_remove =
  espressif/fb_gfx
